# Microsoft Graph API Common Error Codes
# Reference this from any skill when handling API responses

http_codes:
  200:
    meaning: Success
    action: Parse JSON response
  201:
    meaning: Created
    action: Parse JSON response for new resource ID
  202:
    meaning: Accepted (no body)
    action: Operation queued (e.g., sendMail)
  204:
    meaning: No Content
    action: Operation succeeded (e.g., delete, mark read)
  400:
    meaning: Bad Request
    action: Check request body format and field values
  401:
    meaning: Unauthorized / Token expired
    action: "`python3 ${CLAUDE_PLUGIN_ROOT}/scripts/graph_call.py` refreshes and retries automatically. If it still returns 401, show the user the command in `message` (error auth_required — sign in, or --reauth for an expired/revoked session; error auth_config — the Azure client secret has expired: update OUTLOOK_CLIENT_SECRET in .env, re-authenticating will not help)"
  403:
    meaning: Insufficient permissions
    action: User must re-authenticate with broader scopes
  404:
    meaning: Resource not found
    action: Resource may have been deleted or moved; report to user
  409:
    meaning: Conflict
    action: Resource was modified by another client or name already exists
  429:
    meaning: Too Many Requests (throttled)
    action: Wait `retry_after` seconds (from the graph_call.py result), then retry; slow down bulk loops
  500:
    meaning: Internal Server Error
    action: Retry once after 2-second wait
  503:
    meaning: Service Unavailable (or a transient network / token-refresh failure from graph_call.py)
    action: Wait `retry_after` seconds if present, otherwise retry with exponential backoff (2s, 4s, 8s)
  504:
    meaning: Timeout (graph_call.py got no response within 30s)
    action: Retry once; for large listings reduce $top or $select fewer fields

# Microsoft Graph API Best Practices
# Reference this from skills for consistent API interaction patterns

pagination:
  description: "Always use @odata.nextLink for multi-page results"
  rules:
    - "Never manually construct $skip or $skipToken parameters"
    - "Use the complete @odata.nextLink URL as-is for the next page"
    - "Don't reuse tokens from retry operations — they may become invalid"
    - "Check for @odata.nextLink in response to know if more pages exist"
  pattern: |
    # Check for next page in response
    python3 -c "
    import sys, json
    data = json.load(sys.stdin)
    items = data.get('value', [])
    # ... process items ...
    next_link = data.get('@odata.nextLink')
    if next_link:
        print(f'NEXT_PAGE: {next_link}')
    "

throttling:
  description: "Outlook service has strict rate limits"
  limits:
    max_concurrent_requests: 4
    max_requests_per_10min: 10000  # per app per mailbox
    recommended_rate: "4-10 requests per second"
  rules:
    - "Always respect Retry-After header on 429 responses"
    - "Use exponential backoff: 2s, 4s, 8s, 16s"
    - "Never exceed 4 concurrent requests to Outlook endpoints"
    - "Prefer $select to reduce response payload size"

performance:
  description: "Optimize API calls for speed and efficiency"
  rules:
    - "Always use $select to request only needed fields"
    - "Use $top to limit result count (default can be large)"
    - "Use $orderby to get results in desired order server-side"
    - "Prefer calendarView over /events for date-range queries"
  select_example: "$select=id,subject,from,receivedDateTime,bodyPreview,isRead"

timezone_header:
  description: "Use Prefer header for calendar GET requests"
  pattern: '-H "Prefer: outlook.timezone=\"America/New_York\""'
  note: "Returns event times in the specified timezone instead of UTC"

large_attachments:
  description: "Use upload sessions for attachments larger than 3MB"
  threshold: "3MB"
  max_size: "150MB"
  rules:
    - "Under 3MB: Inline base64 in the message JSON"
    - "3MB-150MB: Create upload session, then iterative PUT requests"
  upload_session_pattern: |
    # Step 1: Create upload session
    python3 ${CLAUDE_PLUGIN_ROOT}/scripts/graph_call.py POST "/me/messages/{messageId}/attachments/createUploadSession" '{"AttachmentItem": {"attachmentType": "file", "name": "large-file.pdf", "size": FILE_SIZE_BYTES}}'
    # Step 2: PUT file chunks to the uploadUrl returned in step 1

batch_requests:
  description: "Combine multiple operations in one HTTP call"
  max_requests: 20
  max_payload: "~4MB"
  rules:
    - "Each request in batch is throttled independently"
    - "If any request gets 429, dependent requests fail with 424"
    - "Max 4 concurrent Outlook requests within a batch"
  note: "For simple sequential operations, individual curl calls are simpler"

select_fields:
  email_list: "id,subject,from,toRecipients,receivedDateTime,bodyPreview,hasAttachments,importance,isRead"
  email_read: "id,subject,from,toRecipients,ccRecipients,receivedDateTime,body,hasAttachments,importance,isRead,flag,categories"
  calendar_list: "id,subject,bodyPreview,start,end,location,organizer,attendees,isAllDay,isCancelled,showAs,categories,isOnlineMeeting"
  contacts_list: "id,givenName,surname,emailAddresses,mobilePhone,businessPhones,companyName,jobTitle"
  folders_list: "id,displayName,totalItemCount,unreadItemCount,childFolderCount"

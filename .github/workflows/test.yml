name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m py_compile scripts/graph_call.py outlook-skills/token_helper.py
      - run: npm test

  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (bash setup + auth scripts)
        run: shellcheck -S error setup/*.sh outlook-skills/*.sh
      - name: PSScriptAnalyzer (PowerShell scripts)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path setup,outlook-skills -Recurse -Severity Error
          if ($issues) { $issues | Format-Table; exit 1 }

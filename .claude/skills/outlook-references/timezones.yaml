# Common IANA Timezones for Microsoft Graph API
# Use these with dateTimeTimeZone objects and Prefer: outlook.timezone header
# Ask the user's timezone if not established

americas:
  - America/New_York        # Eastern (UTC-5/-4)
  - America/Chicago         # Central (UTC-6/-5)
  - America/Denver          # Mountain (UTC-7/-6)
  - America/Los_Angeles     # Pacific (UTC-8/-7)
  - America/Anchorage       # Alaska (UTC-9/-8)
  - Pacific/Honolulu        # Hawaii (UTC-10)
  - America/Toronto         # Eastern Canada
  - America/Vancouver       # Pacific Canada
  - America/Mexico_City     # Central Mexico
  - America/Sao_Paulo       # Brazil (UTC-3)
  - America/Buenos_Aires    # Argentina (UTC-3)

europe:
  - Europe/London           # GMT/BST (UTC+0/+1)
  - Europe/Paris            # CET/CEST (UTC+1/+2)
  - Europe/Berlin           # CET/CEST (UTC+1/+2)
  - Europe/Amsterdam        # CET/CEST (UTC+1/+2)
  - Europe/Madrid           # CET/CEST (UTC+1/+2)
  - Europe/Rome             # CET/CEST (UTC+1/+2)
  - Europe/Zurich           # CET/CEST (UTC+1/+2)
  - Europe/Stockholm        # CET/CEST (UTC+1/+2)
  - Europe/Helsinki         # EET/EEST (UTC+2/+3)
  - Europe/Moscow           # MSK (UTC+3)
  - Europe/Istanbul         # TRT (UTC+3)

asia_pacific:
  - Asia/Dubai              # GST (UTC+4)
  - Asia/Kolkata            # IST (UTC+5:30)
  - Asia/Singapore          # SGT (UTC+8)
  - Asia/Shanghai           # CST (UTC+8)
  - Asia/Hong_Kong          # HKT (UTC+8)
  - Asia/Tokyo              # JST (UTC+9)
  - Asia/Seoul              # KST (UTC+9)
  - Australia/Sydney        # AEST/AEDT (UTC+10/+11)
  - Australia/Melbourne     # AEST/AEDT (UTC+10/+11)
  - Pacific/Auckland        # NZST/NZDT (UTC+12/+13)

universal:
  - UTC                     # Coordinated Universal Time
